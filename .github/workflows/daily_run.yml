name: Daily Execution Workflow

on:
  schedule:
    # Runs everyday at 4:10 PM IST (10:40 AM UTC)
    - cron: '40 10 * * *'
  # Allows manual triggering from main branch anytime
  workflow_dispatch:

jobs:
  run-daily-task:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Python script
        run: python main.py